[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatewaykit"
version = "0.1.0"
description = "Python client for the GatewayKit LLM gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["gatewaykit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
