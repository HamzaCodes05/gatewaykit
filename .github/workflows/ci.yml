name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: gatewaykit, POSTGRES_PASSWORD: gatewaykit, POSTGRES_DB: gatewaykit }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gatewaykit" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      JWT_SECRET: ci-secret
      ADMIN_EMAIL: admin@gatewaykit.dev
      ADMIN_PASSWORD: admin1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install && npm run build
        working-directory: api
      - name: Start API
        working-directory: api
        run: |
          node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 40); do curl -s -o /dev/null localhost:4000/v1/models && break; sleep 1; done
      - name: End-to-end smoke test (mock model, no API key needed)
        run: python3 scripts/smoke.py
      - if: failure()
        run: cat api/api.log

  sdk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk-python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install && npm run build
